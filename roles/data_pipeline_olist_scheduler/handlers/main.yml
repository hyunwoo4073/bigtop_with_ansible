---
- name: Reload systemd after Olist unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload Prometheus rules via SIGHUP
  ansible.builtin.command:
    argv:
      - systemctl
      - kill
      - --kill-who=main
      - -s
      - HUP
      - "{{ data_pipeline_olist_scheduler_prometheus_unit }}"
  changed_when: true
