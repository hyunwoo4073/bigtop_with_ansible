---
- name: Verify safe backup configuration
  ansible.builtin.assert:
    that:
      - web_console_pg_backup_database is match('^[a-z][a-z0-9_]*$')
      - web_console_pg_backup_dir is match('^/var/backups/[A-Za-z0-9_./-]+$')
      - "'..' not in web_console_pg_backup_dir.split('/')"
      - web_console_pg_backup_script_dir is match('^/usr/local/lib/[A-Za-z0-9_./-]+$')
      - web_console_pg_backup_retention_days | int >= 1
      - web_console_pg_backup_retention_days | int <= 365
      - web_console_pg_backup_min_bytes | int >= 100
    fail_msg: 'Backup config must use safe local paths and a valid DB name.'

- name: Ensure local PostgreSQL client utilities exist
  ansible.builtin.apt:
    name: postgresql-client
    state: present
    update_cache: false

- name: Confirm PostgreSQL server accepts local connections
  ansible.builtin.command:
    argv:
      - pg_isready
      - -q
  changed_when: false

- name: Confirm configured database exists without changing it
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - --no-psqlrc
      - --tuples-only
      - --no-align
      - --dbname=postgres
      - --command
      - "SELECT 1 FROM pg_database WHERE datname = '{{ web_console_pg_backup_database }}';"
  register: web_console_pg_backup_database_check
  changed_when: false

- name: Refuse to provision or overwrite an unknown database
  ansible.builtin.assert:
    that:
      - web_console_pg_backup_database_check.stdout | trim == '1'
    fail_msg: 'Expected PostgreSQL database is missing; run the existing DB playbook first.'

- name: Create restricted parent backup directory
  ansible.builtin.file:
    path: "{{ web_console_pg_backup_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Create restricted PostgreSQL backup directory
  ansible.builtin.file:
    path: "{{ web_console_pg_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Create backup helper location
  ansible.builtin.file:
    path: "{{ web_console_pg_backup_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy PostgreSQL backup utility
  ansible.builtin.template:
    src: pg_backup.sh.j2
    dest: "{{ web_console_pg_backup_script_dir }}/pg_backup.sh"
    owner: root
    group: root
    mode: '0755'

- name: Deploy safe isolated restore verifier
  ansible.builtin.template:
    src: pg_restore_check.sh.j2
    dest: "{{ web_console_pg_backup_script_dir }}/pg_restore_check.sh"
    owner: root
    group: root
    mode: '0755'

- name: Validate backup utility shell syntax
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - "{{ web_console_pg_backup_script_dir }}/pg_backup.sh"
  changed_when: false

- name: Validate restore verifier shell syntax
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - "{{ web_console_pg_backup_script_dir }}/pg_restore_check.sh"
  changed_when: false

- name: Deploy PostgreSQL backup service unit
  ansible.builtin.template:
    src: pg_backup.service.j2
    dest: "/etc/systemd/system/{{ web_console_pg_backup_service }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload and restart Web Console backup timer

- name: Deploy PostgreSQL backup timer unit
  ansible.builtin.template:
    src: pg_backup.timer.j2
    dest: "/etc/systemd/system/{{ web_console_pg_backup_timer }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload and restart Web Console backup timer

- name: Apply unit changes before enabling backup timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start scheduled backups
  ansible.builtin.systemd_service:
    name: "{{ web_console_pg_backup_timer }}"
    enabled: true
    state: started
    daemon_reload: true
