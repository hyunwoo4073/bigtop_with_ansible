---
- name: Require installed Step65 application before lifecycle actions
  ansible.builtin.stat:
    path: "{{ olist_kafka65_app }}"
  register: olist_kafka65_app_stat

- name: Refuse execution without explicit Step65 apply
  ansible.builtin.assert:
    that:
      - olist_kafka65_app_stat.stat.isreg | default(false)
    fail_msg: Step65 must be applied and seeded first.

- name: Run strict Step65 YARN start stop or status
  ansible.builtin.command:
    argv:
      - python3
      - "{{ olist_kafka65_control }}"
      - "{{ olist_kafka65_mode }}"
      - --bootstrap
      - "{{ olist_kafka65_bootstrap }}"
  become: true
  become_user: "{{ olist_kafka65_user }}"
  environment:
    HADOOP_CONF_DIR: /etc/hadoop/conf
    SPARK_CONF_DIR: /etc/spark/conf
    PYSPARK_PYTHON: /usr/bin/python3
  register: olist_kafka65_lifecycle
  changed_when: >-
    (olist_kafka65_mode == 'start' and 'STEP65_YARN_START_PASS' in olist_kafka65_lifecycle.stdout)
    or (olist_kafka65_mode == 'stop' and 'STEP65_YARN_STOP_PASS' in olist_kafka65_lifecycle.stdout)
  when: olist_kafka65_mode in ['start', 'status', 'stop']

- name: Print Step65 YARN lifecycle result
  ansible.builtin.debug:
    msg: "{{ olist_kafka65_lifecycle.stdout_lines }}"
  when: olist_kafka65_mode in ['start', 'status', 'stop']

- name: Construct Spark verification or CDC publish arguments
  ansible.builtin.set_fact:
    olist_kafka65_batch_argv: >-
      {{
        ['spark-submit', '--master', 'yarn', '--deploy-mode', 'cluster',
         '--name', 'olist-kafka65-' + olist_kafka65_mode,
         '--queue', olist_kafka65_queue,
         '--driver-memory', '768m', '--executor-memory', '768m',
         '--executor-cores', '1', '--num-executors', '1',
         '--jars', (([olist_kafka65_iceberg_jar] +
                    (olist_kafka65_jars | map('regex_replace', '^', olist_kafka65_jar_dir + '/') | list)) | join(',')),
         '--conf', 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions',
         '--conf', 'spark.sql.catalog.shared=org.apache.iceberg.spark.SparkCatalog',
         '--conf', 'spark.sql.catalog.shared.type=rest',
         '--conf', 'spark.sql.catalog.shared.uri=' + olist_kafka65_rest_uri,
         '--conf', 'spark.sql.shuffle.partitions=4',
         '--conf', 'spark.pyspark.python=/usr/bin/python3',
         olist_kafka65_app, '--mode', olist_kafka65_mode] +
        (['--bootstrap', olist_kafka65_bootstrap]
         if olist_kafka65_mode in ['produce', 'replay', 'verify'] else [])
      }}
  when: olist_kafka65_mode in ['produce', 'replay', 'verify']

- name: Submit Spark job for Step65 producer replay or Iceberg verification
  ansible.builtin.command:
    argv: "{{ olist_kafka65_batch_argv }}"
  become: true
  become_user: "{{ olist_kafka65_user }}"
  environment:
    HADOOP_CONF_DIR: /etc/hadoop/conf
    SPARK_CONF_DIR: /etc/spark/conf
    PYSPARK_PYTHON: /usr/bin/python3
  register: olist_kafka65_batch_output
  changed_when: olist_kafka65_mode in ['produce', 'replay']
  when: olist_kafka65_mode in ['produce', 'replay', 'verify']

- name: Check HDFS Step65 final proof after verification
  ansible.builtin.command:
    argv:
      - hdfs
      - dfs
      - -cat
      - /data/olist/iceberg-validation/step65/v1/_APPLY_REPORT.json
  become: true
  become_user: "{{ olist_kafka65_user }}"
  environment:
    HADOOP_CONF_DIR: /etc/hadoop/conf
  register: olist_kafka65_verify_proof
  changed_when: false
  when: olist_kafka65_mode == 'verify'

- name: Validate Step65 CDC post-image evidence
  ansible.builtin.assert:
    that:
      - (olist_kafka65_verify_proof.stdout | from_json).status == 'PASS'
      - (olist_kafka65_verify_proof.stdout | from_json).rows == 521
      - (olist_kafka65_verify_proof.stdout | from_json).live_rows == 512
      - (olist_kafka65_verify_proof.stdout | from_json).tombstones == 9
      - (olist_kafka65_verify_proof.stdout | from_json).table == 'shared.olist65_stream.fact_cdc_running_v1'
  when: olist_kafka65_mode == 'verify'

- name: Print Stage65 submitted batch stage status
  ansible.builtin.debug:
    msg: "STEP65_{{ olist_kafka65_mode | upper }}_ANSIBLE_PASS"
  when: olist_kafka65_mode in ['produce', 'replay', 'verify']

- name: Read immutable Step65 evidence for Trino cross-engine check
  ansible.builtin.command:
    argv:
      - hdfs
      - dfs
      - -cat
      - "/data/olist/iceberg-validation/step65/v1/_{{ item }}_REPORT.json"
  loop:
    - SEED
    - PRODUCE
    - APPLY
  become: true
  become_user: "{{ olist_kafka65_user }}"
  environment:
    HADOOP_CONF_DIR: /etc/hadoop/conf
  register: olist_kafka65_all_proofs
  changed_when: false
  when: olist_kafka65_mode == 'verify'

- name: Prepare local controller evidence directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../artifacts"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  when: olist_kafka65_mode == 'verify'

- name: Export Step65 immutable proof copies for local Trino verifier
  ansible.builtin.copy:
    content: "{{ item.stdout | trim }}\n"
    dest: "{{ playbook_dir }}/../artifacts/65-kafka-cdc-{{ item.item | lower }}.json"
    mode: '0644'
  loop: "{{ olist_kafka65_all_proofs.results }}"
  delegate_to: localhost
  become: false
  when: olist_kafka65_mode == 'verify'
