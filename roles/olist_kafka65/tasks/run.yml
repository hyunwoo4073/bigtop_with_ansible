---
- name: Require installed Step65 application before lifecycle actions
  ansible.builtin.stat:
    path: "{{ olist_kafka65_app }}"
  register: olist_kafka65_app_stat

- name: Refuse execution without explicit Step65 apply
  ansible.builtin.assert:
    that:
      - olist_kafka65_app_stat.stat.isreg | default(false)
    fail_msg: Step65 must be applied and seeded first.

- name: Run strict Step65 YARN start stop or status
  ansible.builtin.command:
    argv:
      - python3
      - "{{ olist_kafka65_control }}"
      - "{{ olist_kafka65_mode }}"
      - --bootstrap
      - "{{ olist_kafka65_bootstrap }}"
  become: true
  become_user: "{{ olist_kafka65_user }}"
  environment:
    HADOOP_CONF_DIR: /etc/hadoop/conf
    SPARK_CONF_DIR: /etc/spark/conf
    PYSPARK_PYTHON: /usr/bin/python3
  register: olist_kafka65_lifecycle
  changed_when: >-
    (olist_kafka65_mode == 'start' and 'STEP65_YARN_START_PASS' in olist_kafka65_lifecycle.stdout)
    or (olist_kafka65_mode == 'stop' and 'STEP65_YARN_STOP_PASS' in olist_kafka65_lifecycle.stdout)
  when: olist_kafka65_mode in ['start', 'status', 'stop']

- name: Print Step65 YARN lifecycle result
  ansible.builtin.debug:
    msg: "{{ olist_kafka65_lifecycle.stdout_lines }}"
  when: olist_kafka65_mode in ['start', 'status', 'stop']

- name: Run Step65 lightweight Kafka or Trino/HDFS validation without Spark
  ansible.builtin.include_tasks: light_run.yml
  when: olist_kafka65_mode in ['produce', 'replay', 'reconcile', 'verify']
