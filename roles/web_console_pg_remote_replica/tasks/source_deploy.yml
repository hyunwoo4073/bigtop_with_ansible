---
- name: Resolve verified receiver network address
  ansible.builtin.set_fact:
    web_console_pg_remote_replica_receiver_address: >-
      {{ hostvars[web_console_pg_remote_replica_target_host].ansible_host
         | default(web_console_pg_remote_replica_target_host) }}

- name: Ensure receiver network address is a safe SSH hostname or IPv4
  ansible.builtin.assert:
    that:
      - web_console_pg_remote_replica_receiver_address is match('^[a-zA-Z0-9_.-]+$')
      - >-
        (hostvars[web_console_pg_remote_replica_target_host].web_console_pg_remote_replica_receiver_host_key.content
        | b64decode | trim).startswith('ssh-ed25519 ')
    fail_msg: Receiver hostname or trusted SSH host key is missing.

- name: Install pinned receiver SSH host key
  ansible.builtin.copy:
    content: >-
      {{ web_console_pg_remote_replica_receiver_address }}
      {{ (hostvars[web_console_pg_remote_replica_target_host].web_console_pg_remote_replica_receiver_host_key.content
          | b64decode | trim).split(' ')[0:2] | join(' ') }}
    dest: "{{ web_console_pg_remote_replica_ssh_dir }}/pg_replica_known_hosts"
    owner: postgres
    group: postgres
    mode: '0600'

- name: Install verified hourly replication script
  ansible.builtin.template:
    src: sender_sync.sh.j2
    dest: "{{ web_console_pg_remote_replica_script_dir }}/pg_replica_sync.sh"
    owner: root
    group: root
    mode: '0755'

- name: Validate sender script shell syntax
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - "{{ web_console_pg_remote_replica_script_dir }}/pg_replica_sync.sh"
  changed_when: false

- name: Check restricted SSH login as the PostgreSQL account
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - ssh
      - -i
      - "{{ web_console_pg_remote_replica_ssh_dir }}/{{ web_console_pg_remote_replica_key_name }}"
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - "UserKnownHostsFile={{ web_console_pg_remote_replica_ssh_dir }}/pg_replica_known_hosts"
      - -o
      - ConnectTimeout=10
      - "{{ web_console_pg_remote_replica_dest_user }}@{{ web_console_pg_remote_replica_receiver_address }}"
      - test
      - -w
      - "{{ web_console_pg_remote_replica_dest_dir }}"
  register: web_console_pg_remote_replica_ssh_check
  changed_when: false
  retries: 3
  delay: 3
  until: web_console_pg_remote_replica_ssh_check.rc == 0

- name: Install PostgreSQL remote replica service
  ansible.builtin.template:
    src: sender_sync.service.j2
    dest: "/etc/systemd/system/{{ web_console_pg_remote_replica_service }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart source replica timer

- name: Install PostgreSQL remote replica timer
  ansible.builtin.template:
    src: sender_sync.timer.j2
    dest: "/etc/systemd/system/{{ web_console_pg_remote_replica_timer }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart source replica timer

- name: Activate PostgreSQL remote replica timer
  ansible.builtin.systemd_service:
    name: "{{ web_console_pg_remote_replica_timer }}"
    daemon_reload: true
    enabled: true
    state: started
