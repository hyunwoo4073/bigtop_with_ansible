---
- name: Restart source replica timer
  ansible.builtin.systemd_service:
    name: "{{ web_console_pg_remote_replica_timer }}"
    enabled: true
    state: restarted
    daemon_reload: true

- name: Restart receiver replica prune timer
  ansible.builtin.systemd_service:
    name: "{{ web_console_pg_remote_replica_prune_timer }}"
    enabled: true
    state: restarted
    daemon_reload: true
