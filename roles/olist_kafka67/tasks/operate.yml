---
- name: Ensure collector script is installed before operation
  ansible.builtin.stat:
    path: "{{ olist_kafka67_script }}"
  register: olist_kafka67_installed

- name: Refuse starting an uninstalled Step67 collector
  ansible.builtin.assert:
    that:
      - olist_kafka67_installed.stat.isreg | default(false)

- name: Enable only dedicated Step67 observation timer
  ansible.builtin.systemd_service:
    name: "{{ olist_kafka67_service }}.timer"
    state: started
    enabled: true
  become: true
  when: olist_kafka67_mode == 'enable'

- name: Disable only dedicated Step67 observation timer
  ansible.builtin.systemd_service:
    name: "{{ olist_kafka67_service }}.timer"
    state: stopped
    enabled: false
  become: true
  when: olist_kafka67_mode == 'disable'

- name: Collect fresh local metrics once without YARN Spark submissions
  ansible.builtin.systemd_service:
    name: "{{ olist_kafka67_service }}.service"
    state: started
  become: true
  when: olist_kafka67_mode == 'verify'

- name: Read result file generated by Step67 collector
  ansible.builtin.slurp:
    src: "{{ olist_kafka67_metrics_file }}"
  register: olist_kafka67_result
  when: olist_kafka67_mode == 'verify'

- name: Ensure fresh read-only metrics collection succeeded
  ansible.builtin.assert:
    that:
      - "'bigtop_olist_step67_collector_success{source=\"' ~ olist_kafka67_source ~ '\"} 1' in (olist_kafka67_result.content | b64decode)"
      - olist_kafka67_expected_metric in (olist_kafka67_result.content | b64decode)
  vars:
    olist_kafka67_expected_metric: >-
      {{ 'bigtop_olist_step67_kafka_end_offset'
         if olist_kafka67_source == 'kafka'
         else 'bigtop_olist_step67_spark_committed_offset' }}
  when: olist_kafka67_mode == 'verify'

- name: Print Step67 verification status
  ansible.builtin.debug:
    msg:
      - "STEP67_{{ olist_kafka67_source | upper }}_VERIFY_PASS: {{ inventory_hostname }}"
      - 'Both masters of truth must be scraped by Prometheus; dashboard joins by topic/partition.'
  when: olist_kafka67_mode == 'verify'
