---
# Step 50: manual metadata snapshots; no automatic HDFS or Spark lineage collector.
data_pipeline_olist_catalog_expected_ops: worker3
data_pipeline_olist_catalog_master: master
data_pipeline_olist_catalog_hdfs_user: hadoop
data_pipeline_olist_catalog_version: v1
data_pipeline_olist_catalog_warehouse_version: v1
data_pipeline_olist_catalog_service: bigtop_hdfs_olist
data_pipeline_olist_catalog_api_url: "http://{{ hostvars['metadata'].ansible_host }}:8585/api"
data_pipeline_olist_catalog_token_file: /etc/bigtop-governance/pg-catalog/bot.token
data_pipeline_olist_catalog_install_dir: /usr/local/lib/bigtop-governance/olist-catalog
data_pipeline_olist_catalog_config_dir: /etc/bigtop-governance/olist-catalog
# A default Playbook execution is READ-ONLY with respect to OpenMetadata.
data_pipeline_olist_catalog_apply: false
data_pipeline_olist_catalog_hdfs_address: master:9000
data_pipeline_olist_catalog_raw_files:
  - { name: orders, filename: olist_orders_dataset.csv }
  - { name: order_items, filename: olist_order_items_dataset.csv }
  - { name: customers, filename: olist_customers_dataset.csv }
  - { name: products, filename: olist_products_dataset.csv }
  - { name: payments, filename: olist_order_payments_dataset.csv }
  - { name: reviews, filename: olist_order_reviews_dataset.csv }
  - { name: sellers, filename: olist_sellers_dataset.csv }
  - { name: geolocation, filename: olist_geolocation_dataset.csv }
  - { name: category_translation, filename: product_category_name_translation.csv }
data_pipeline_olist_catalog_outputs:
  - curated/orders
  - curated/order_items
  - curated/customers
  - curated/products
  - curated/order_item_fact
  - quarantine/rows
  - mart/daily_category_sales
